<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | Syntropy Books</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="admin-header-inner">
            <div class="admin-brand">
                <a href="../index.html" aria-label="메인 페이지로 이동">
                    <img src="../images/SB_logo_White.png" alt="Syntropy Books 로고" class="admin-logo">
                </a>
                <div>
                    <p class="admin-brand-kicker">ADMIN</p>
                    <h1>관리자 센터</h1>
                </div>
            </div>

            <nav class="admin-nav" aria-label="관리자 메뉴">
                <a href="admin.html" class="active">대시보드</a>
                <a href="../books/books.html">도서 목록</a>
                <button id="admin-logout" type="button" class="admin-logout-btn">로그아웃</button>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <section class="admin-hero">
            <p class="admin-eyebrow">BOOKSTORE OPERATIONS</p>
            <h2>도서관 운영 대시보드</h2>
            <p class="admin-summary">오늘의 도서 현황과 관리 상태를 한눈에 확인할 수 있습니다.</p>
        </section>

        <section class="admin-stats" aria-label="관리자 요약 통계">
            <article class="admin-card">
                <span class="stat-label">총 도서 수</span>
                <strong class="stat-value" data-stat="total-books">28권</strong>
            </article>
            <article class="admin-card">
                <span class="stat-label">신간 코너</span>
                <strong class="stat-value" data-stat="new-books">6권</strong>
            </article>
            <article class="admin-card">
                <span class="stat-label">카테고리</span>
                <strong class="stat-value" data-stat="categories">8개</strong>
            </article>
            <article class="admin-card">
                <span class="stat-label">접속 상태</span>
                <strong class="stat-value success" data-stat="status">정상</strong>
            </article>
        </section>

        <section class="admin-panel">
            <div class="admin-panel-header">
                <h3>최근 도서 관리</h3>
                <button type="button" class="admin-action-btn">도서 추가</button>
            </div>

            <div class="admin-book-list">
                <div class="admin-book-row">
                    <span>통합적 사고</span>
                    <span>시스템 사고</span>
                    <span>활성</span>
                </div>
                <div class="admin-book-row">
                    <span>생태학의 미래</span>
                    <span>생태학</span>
                    <span>활성</span>
                </div>
                <div class="admin-book-row">
                    <span>우주와 시간</span>
                    <span>우주론</span>
                    <span>검토 중</span>
                </div>
                <div class="admin-book-row">
                    <span>인간과 진화</span>
                    <span>진화</span>
                    <span>활성</span>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/admin-page.js"></script>
</body>
</html>
