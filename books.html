<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 목록 | Netropy Books</title>
    <style>
        body { 
            background-color: #fdf6e3; 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        .header-section {
            background-color: #eee8d5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
            border-bottom: 2px solid #586e75;
            gap: 15px;
        }

        /* ✨ 메인 페이지와 동일한 테두리 및 효과가 적용된 로고 스타일 */
        .logo-link {
            display: inline-block;
        }
        .header-logo { 
            width: 140px; 
            height: auto; 
            padding: 15px;
            background-color: #ffffff;
            border: 1px solid #586e75;
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .header-logo:hover { 
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .nav-bar { 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap; 
            justify-content: center;
            padding: 0 10px;
        }
        .nav-bar a {
            text-decoration: none; 
            color: #268bd2; 
            font-weight: bold; 
            font-size: 15px;
            padding: 8px 16px; 
            background-color: #ffffff; 
            border: 1px solid #268bd2;
            border-radius: 5px; 
            transition: all 0.3s ease;
        }
        .nav-bar a:hover { 
            background-color: #268bd2; 
            color: #ffffff; 
        }

        .book-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .book-card {
            background-color: #ffffff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .book-card h3 { color: #b58900; }
        .book-card p { color: #586e75; font-size: 14px; }

        .footer-section {
            background-color: #073642;
            color: #93a1a1;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: 60px;
        }

        @media screen and (max-width: 768px) {
            .header-section { padding: 15px 0; gap: 10px; }
            .header-logo { width: 110px; padding: 10px; }
            .nav-bar a { font-size: 14px; padding: 6px 12px; }
        }
    </style>
</head>
<body>

    <header class="header-section">
        <a href="index.html" class="logo-link">
            <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="header-logo">
        </a>
        <nav class="nav-bar">
            <a href="about.html">책방 소개</a>
            <a href="books.html" style="background-color: #268bd2; color: #ffffff;">도서 목록</a>
            <a href="contact.html">오시는 길</a>
        </nav>
    </header>

    <main class="book-container">
        <div class="book-card">
            <h3>엔트로피의 법칙</h3>
            <p>과학과 질서에 관한 필독서</p>
        </div>
        <div class="book-card">
            <h3>우주의 탄생</h3>
            <p>질서를 찾아가는 여정</p>
        </div>
        <div class="book-card">
            <h3>넷트로피의 이해</h3>
            <p>우리의 철학이 담긴 책</p>
        </div>
    </main>

    <footer class="footer-section">
        <p>&copy; 2026 Netropy Books. All rights reserved.</p>
    </footer>

</body>
</html>
