<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 목록 | Netropy Books</title>
    <style>
        /* 기존 index.html의 스타일과 통일감을 줍니다 */
        body { background-color: #fdf6e3; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        
        .header-section { 
            background-color: #eee8d5; 
            display: flex;             /* 가로 배치를 위한 핵심 */
            justify-content: space-between; /* 로고는 왼쪽 끝, 메뉴는 오른쪽 끝으로 */
            align-items: center;    /* 세로 기준 가운데 정렬 */    
            padding: 20px 40px; 
            border-bottom: 2px solid #586e75; 
        }
        
        /* 로고 크기 조정 */
        .header-logo {
            width: 120px; /* 로고를 적당한 크기로 줄임 */
            height: auto;
        }

        /* 🧭 메뉴 바 스타일 */
        .nav-bar { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
        }
        
        .nav-bar a { 
            text-decoration: none; 
            color: #268bd2; 
            font-weight: bold; 
            padding: 8px 16px; 
            background: #fff; 
            border: 1px solid #268bd2; 
            border-radius: 5px; 
            transition: all 0.3s ease;
        }

        /* 마우스를 올렸을 때의 효과 */
        .nav-bar a:hover {
            background-color: #268bd2;
            color: #ffffff;
        }
        
        /* ✨ [핵심] 카드형 레이아웃 (도서 목록) */
        .book-container {
            display: grid;             /* 격자 형태로 배치 */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* 화면 크기에 따라 카드 개수 자동 조절 */
            gap: 20px;                 /* 카드 사이 간격 */
            padding: 40px;             /* 외부 여백 */
            max-width: 1000px;         /* 카드들이 너무 넓어지지 않게 최대 폭 제한 */
            margin: 0 auto;            /* 중앙 정렬 */
        }

        .book-card {
            background-color: #ffffff; /* 카드 배경은 하얗게 */
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;       /* 모서리를 둥글게 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* 살짝 그림자 효과 */
            text-align: center;
        }

        .book-card h3 { color: #b58900; }
        .book-card p { color: #586e75; font-size: 14px; }
    </style>
</head>
<body>

    <!-- 상단 헤더 구역 -->
    <header class="header-section">
        <!-- 로고 영역: 왼쪽 끝으로 배치 -->
        <a href="index.html" class="logo-link">
            <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="header-logo">
        </a>

        <!-- 🧭 내비게이션 메뉴: 현재 페이지인 '도서 목록'에 파란색 강조 표시 -->
        <nav class="nav-bar">
            <a href="about.html">책방 소개</a>
            <a href="books.html" style="background-color: #268bd2; color: #ffffff;">도서 목록</a>
            <a href="contact.html">오시는 길</a>
        </nav>
    </header>

    <!-- 📦 도서 목록이 담길 카드 박스들 -->
    <main class="book-container">
        <div class="book-card">
            <h3>엔트로피의 법칙</h3>
            <p>과학과 질서에 관한 필독서</p>
        </div>
        <div class="book-card">
            <h3>우주의 탄생</h3>
            <p>질서를 찾아가는 여정</p>
        </div>
        <div class="book-card">
            <h3>넷트로피의 이해</h3>
            <p>우 우리의 철학이 담긴 책</p>
        </div>
    </main>

</body>
</html>
