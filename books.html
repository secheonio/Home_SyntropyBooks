<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 목록 | Netropy Books</title>
    <style>
        /* 기존 index.html의 스타일과 통일감을 줍니다 */
        body { background-color: #fdf6e3; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        
        .header-section { background-color: #eee8d5; padding: 20px; text-align: center; border-bottom: 2px solid #586e75; }
        
        /* 🧭 메뉴 바 스타일 (이전과 동일) */
        .nav-bar { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .nav-bar a { text-decoration: none; color: #268bd2; font-weight: bold; padding: 8px 16px; background: #fff; border: 1px solid #268bd2; border-radius: 5px; }
        
        /* ✨ [핵심] 카드형 레이아웃 (도서 목록) */
        .book-container {
            display: grid;             /* 격자 형태로 배치 */
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); /* 화면 크기에 따라 카드 개수 자동 조절 */
            gap: 20px;                 /* 카드 사이 간격 */
            padding: 40px;             /* 외부 여백 */
            max-width: 1000px;         /* 카드들이 너무 넓어지지 않게 최대 폭 제한 */
            margin: 0 auto;            /* 중앙 정렬 */
        }

        .book-card {
            background-color: #ffffff; /* 카드 배경은 하얗게 */
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;       /* 모서리를 둥글게 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); /* 살짝 그림자 효과 */
            text-align: center;
        }

        .book-card h3 { color: #b58900; }
        .book-card p { color: #586e75; font-size: 14px; }
    </style>
</head>
<body>

    <header class="header-section">
        <h2>도서 목록</h2>
        <nav class="nav-bar">
            <a href="index.html">홈</a>
            <a href="books.html">도서 목록</a>
        </nav>
    </header>

    <!-- 📦 도서 목록이 담길 카드 박스들 -->
    <main class="book-container">
        <div class="book-card">
            <h3>엔트로피의 법칙</h3>
            <p>과학과 질서에 관한 필독서</p>
        </div>
        <div class="book-card">
            <h3>우주의 탄생</h3>
            <p>질서를 찾아가는 여정</p>
        </div>
        <div class="book-card">
            <h3>넷트로피의 이해</h3>
            <p>우리의 철학이 담긴 책</p>
        </div>
    </main>

</body>
</html>
