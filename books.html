<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 목록 | Netropy Books</title>
    <style>
        /* ========================================== */
        /* 1. 서브 페이지 공통 기본 스타일             */
        /* ========================================== */
        body { 
            background-color: #fdf6e3; 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        /* ========================================== */
        /* 2. 상단 헤더 전체 영역 (두 줄 구조)        */
        /* ========================================== */
        .header-section {
            background-color: #eee8d5;
            display: flex;
            flex-direction: column;         /* 세로로 두 줄 배치 */
            align-items: center;            /* 가로 기준 중앙 정렬 */
            justify-content: center;
            padding: 20px 0;
            border-bottom: 2px solid #586e75;
            gap: 15px;                      /* 위쪽 로고와 아래쪽 메뉴 사이의 간격 */
        }

        /* 위쪽 영역: 로고 스타일 (마우스 올리면 1.2배 확대) */
        .logo-link {
            display: inline-block;
        }
        .header-logo { 
            width: 140px; 
            height: auto; 
            transition: transform 0.3s ease; /* 부드러운 확대 효과 */
        }
        .header-logo:hover { 
            transform: scale(1.2);          /* 1.2배 확대 */
        }

        /* 아래쪽 영역: 내비게이션 메뉴 바 */
        .nav-bar { 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap;                /* 화면이 아주 좁을 경우 메뉴가 다음 줄로 자연스럽게 떨어지도록 함 */
            justify-content: center;
            padding: 0 10px;
        }
        .nav-bar a {
            text-decoration: none; 
            color: #268bd2; 
            font-weight: bold; 
            font-size: 15px;
            padding: 8px 16px; 
            background-color: #ffffff; 
            border: 1px solid #268bd2;
            border-radius: 5px; 
            transition: all 0.3s ease;
        }
        .nav-bar a:hover { 
            background-color: #268bd2; 
            color: #ffffff; 
        }

        /* ========================================== */
        /* 3. 모바일 반응형 디자인 (화면이 좁아질 때)   */
        /* ========================================== */
        @media screen and (max-width: 768px) {
            .header-section {
                padding: 15px 0;
                gap: 10px;
            }
            
            .header-logo {
                width: 110px;                 /* 스마트폰 화면에서는 로고를 살짝 더 아담하게 조절 */
            }

            .nav-bar a {
                font-size: 14px;
                padding: 6px 12px;            /* 모바일에서 버튼 크기를 손가락으로 누르기 좋게 최적화 */
            }
        }
    </style>
</head>
<body>

    <!-- 상단 두 줄 헤더 구역 -->
    <header class="header-section">
        <!-- 첫 번째 줄 (위쪽): 로고 (클릭 시 홈 이동, 호버 시 1.2배 확대) -->
        <a href="index.html" class="logo-link">
            <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="header-logo">
        </a>

        <!-- 두 번째 줄 (아래쪽): 내비게이션 메뉴 바 -->
        <nav class="nav-bar">
            <!-- 현재 머물고 있는 페이지에는 파란색 배경 스타일을 넣어주세요! -->
            <a href="about.html">책방 소개</a>
            <a href="books.html" style="background-color: #268bd2; color: #ffffff;">도서 목록</a>
            <a href="contact.html">오시는 길</a>
        </nav>
    </header>

    <!-- 📦 도서 목록이 담길 카드 박스들 -->
    <main class="book-container">
        <div class="book-card">
            <h3>엔트로피의 법칙</h3>
            <p>과학과 질서에 관한 필독서</p>
        </div>
        <div class="book-card">
            <h3>우주의 탄생</h3>
            <p>질서를 찾아가는 여정</p>
        </div>
        <div class="book-card">
            <h3>넷트로피의 이해</h3>
            <p>우 우리의 철학이 담긴 책</p>
        </div>
    </main>

</body>
</html>
