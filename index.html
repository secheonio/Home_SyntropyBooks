<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <title>NetropyBooks의 홈페이지</title>
        <style>
            body {
                background-color: #fdf6e3;
                font-family: 'Arial', sans-serif;
                text-align: center;
                margin: 0;
                padding: 0;
            }

            /* 1. 상단 구역 디자인 */
            .header-section {
                background-color: #eee8d5; /* 본문과 구분되는 연한 배경색 */
                padding: 40px 20px;
                border-bottom: 2px solid #586e75; /* 아래쪽 경계선 */
            }

            .main-logo {
                width: 180px;
                height: auto;
                padding: 15px;
                border: 1px solid #586e75;
                border-radius: 10px;
                background-color: #ffffff;
                margin-bottom: 20px;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }

            .main-logo:hover {
                transform: scale(1.25);
                box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            }

            h1 {
                margin-top: 10px;
            }

            .title-line1 {
                font-size: 20px;
                color: #657b83;
                margin-bottom: 5px;
            }

            .title-line2 {
                font-size: 30px;
                color: #b58900;
                font-weight: bold;
                margin-bottom: 5px;
            }

            .title-line3 {
                font-size: 24px;
                color: #268bd2;
            }

            /* 2. 본문 구역 디자인 */
            .content-section {
                padding: 50px 20px;
                font-size: 18px;
                color: #333333;
                line-height: 1.6;
            }

            /* 3. 하단 구역 디자인 */
            .footer-section {
                background-color: #073642; /* 차분한 어두운 색상 */
                color: #93a1a1;            /* 밝은 회색빛 글씨 */
                padding: 20px;
                font-size: 14px;
                position: fixed;           /* 화면 맨 아래에 고정하고 싶을 때 사용 */
                bottom: 0;
                width: 100%;
            }
        </style>

    </head>
    
    <body>
        <!-- 1. 상단 구역 (Header): 로고나 메뉴가 들어가는 자리 -->
        <header class="header-section">
            <a href="index.html">
                <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="main-logo">
            </a>
            <h1>
                <div class="title-line1">안녕하세요?</div>
                <div class="title-line2">NetropyBooks의 홈페이지에</div>
                <div class="title-line3">오신 것을 환영합니다.</div>
            </h1>
        </header>

        <!-- 2. 본문 구역 (Main Content): 책 소개나 핵심 내용이 들어갈 자리 -->
        <main class="content-section">
            <p>VS Code와 GitHub Pages로 제작한 과학 책방입니다.</p>
            <p>질서와 안정을 찾아가는 다양한 도서들을 만나보세요.</p>
        </main>

        <!-- 3. 하단 구역 (Footer): 저작권이나 연락처가 들어갈 자리 -->
        <footer class="footer-section">
            <p>&copy; 2026 Netropy Books. All rights reserved.</p>
        </footer>
    </body>

</html>
