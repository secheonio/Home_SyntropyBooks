    <!-- 2. 메인 페이지 전용 스타일시트 -->
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- 상단 헤더 영역 -->
    <header class="header-section">
        <!-- 로고 클릭 시 메인 페이지(index.html)로 이동 -->
        <a href="index.html">
            <img src="images/SyntropyBooks_logo.png" alt="Syntropy Books 로고" class="main-logo">
        </a>

        <!-- 메인 환영 문구 -->
        <h1>
            <div class="title-line1">안녕하세요?</div>
            <div class="title-line2">Syntropy Books에</div>
            <div class="title-line3">오신 것을 환영합니다.</div>
        </h1>

        <!-- 상단 내비게이션 메뉴 -->
        <nav class="site-menu" aria-label="메인 메뉴">
            <div class="site-menu-group">
                <a href="about/bookstore-philosophy.html" class="site-menu-parent">서점 소개</a>
                <div class="site-menu-sub">
                    <a href="about/bookstore-philosophy.html">서점 철학</a>
                    <a href="about/bookstore-guide.html">이용 안내</a>
                    <a href="contact/contact.html">오시는 길</a>
                </div>
            </div>

            <div class="site-menu-group">
                <a href="books/books.html" class="site-menu-parent">SyntropyBooks</a>
                <div class="site-menu-sub">
                    <a href="books/life-science.html">생명과 과학</a>
                    <a href="books/cosmos.html">우주와 질서</a>
                    <a href="books/evolution.html">진화와 협력</a>
                    <a href="books/energy.html">문명과 에너지</a>

                    <a href="books/books.html#uncategorized">미분류</a>
                </div>
            </div>

            <div class="site-menu-group">
                <a href="books/books-new.html" class="site-menu-parent">신간 도서</a>
                <div class="site-menu-sub">
                    <a href="books/books-new.html#life-science">생명과 과학</a>
                    <a href="books/books-new.html#cosmos">우주와 질서</a>
                    <a href="books/books-new.html#evolution">진화와 협력</a>

                </div>
            </div>
        </nav>
    </header>

    <!-- 본문 콘텐츠 영역 -->
    <main class="content-section">
        <p>무질서한 세상을 밝히는 과학과 철학의 공간입니다.</p>
        <p>질서와 안정을 찾아가는 다양한 도서들을 만나보세요.</p>
    </main>

    <!-- 하단 푸터 영역 -->
    <footer class="footer-section">
        <button class="admin-trigger" type="button" aria-label="관리자 로그인 열기"></button>
        <p>&copy; 2026 Syntropy Books. All rights reserved.</p>
    </footer>

    <div class="admin-modal" id="admin-login-modal" hidden>
        <div class="admin-modal-backdrop" data-admin-close></div>
        <section class="admin-dialog" role="dialog" aria-modal="true" aria-labelledby="admin-login-title">
            <button class="admin-dialog-close" type="button" aria-label="관리자 로그인 닫기" data-admin-close>&times;</button>
            <p class="admin-eyebrow">ADMIN ACCESS</p>
            <h2 id="admin-login-title">관리자 로그인</h2>
            <form id="admin-login-form">
                <label for="admin-login-id">관리자 아이디</label>
                <input id="admin-login-id" name="loginId" type="text" autocomplete="username" required>
                <label for="admin-login-password">비밀번호</label>
                <div class="admin-password-field">
                    <input id="admin-login-password" name="password" type="password" autocomplete="current-password" required>
                    <button class="admin-password-toggle" type="button" aria-label="비밀번호 보기" aria-pressed="false">&#128065;</button>
                </div>
                <button type="submit">로그인</button>
                <p class="admin-login-status" id="admin-login-status" aria-live="polite"></p>
            </form>
        </section>
    </div>

    <script src="js/admin-login.js"></script>
