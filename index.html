<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Netropy Books</title>
    <style>
        body { background-color: #fdf6e3; font-family: 'Arial', sans-serif; text-align: center; margin: 0; padding: 0; }
        
        /* 1. 헤더 디자인 (Flexbox 사용하여 로고 왼쪽, 메뉴 오른쪽 배치) */
        .header-section {
            display: flex;
            justify-content: space-between; /* 로고와 메뉴를 양 끝으로 정렬 */
            align-items: center;            /* 세로 기준 가운데 정렬 */
            background-color: #eee8d5;
            padding: 20px 40px;
            border-bottom: 2px solid #586e75;
        }

        /* 2. 로고 영역 */
        .main-logo { width: 120px; height: auto; transition: transform 0.3s ease; }
        .main-logo:hover { transform: scale(1.05); }

        /* 3. 내비게이션 메뉴 바 */
        .nav-bar { display: flex; gap: 20px; }
        .nav-bar a {
            text-decoration: none; color: #268bd2; font-weight: bold; font-size: 16px;
            padding: 8px 16px; background-color: #ffffff; border: 1px solid #268bd2;
            border-radius: 5px; transition: all 0.3s ease;
        }
        .nav-bar a:hover { background-color: #268bd2; color: #ffffff; }

        /* 4. 본문 및 나머지 */
        .content-section { padding: 50px 20px; font-size: 18px; color: #333333; line-height: 1.6; }
        .footer-section { background-color: #073642; color: #93a1a1; padding: 20px; font-size: 14px; }
    </style>
</head>
<body>

    <header class="header-section">
        <!-- 로고를 왼쪽 끝으로 배치 -->
        <a href="index.html">
            <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="main-logo">
        </a>

        <!-- '홈' 버튼을 제거하고 로고 클릭으로 대체 -->
        <nav class="nav-bar">
            <a href="about.html">책방 소개</a>
            <a href="books.html">도서 목록</a>
            <a href="contact.html">오시는 길</a>
        </nav>
    </header>

    <main class="content-section">
        <h1>Netropy Books</h1>
        <p>VS Code와 GitHub Pages로 제작한 과학 책방입니다.</p>
        <p>질서와 안정을 찾아가는 다양한 도서들을 만나보세요.</p>
    </main>

    <footer class="footer-section">
        <p>&copy; 2026 Netropy Books. All rights reserved.</p>
    </footer>

</body>
</html>
