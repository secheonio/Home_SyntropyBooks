<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오시는 길 | Netropy Books</title>
    <style>
        /* ========================================== */
        /* 1. 서브 페이지 공통 기본 스타일             */
        /* ========================================== */
        body { 
            background-color: #fdf6e3; 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
        }

        /* ========================================== */
        /* 2. 상단 헤더 전체 영역 (두 줄 구조)        */
        /* ========================================== */
        .header-section {
            background-color: #eee8d5;
            display: flex;
            flex-direction: column;         /* 세로로 두 줄 배치 */
            align-items: center;            /* 가로 기준 중앙 정렬 */
            justify-content: center;
            padding: 20px 0;
            border-bottom: 2px solid #586e75;
            gap: 15px;                      /* 위쪽 로고와 아래쪽 메뉴 사이의 간격 */
        }

        /* 위쪽 영역: 로고 스타일 (마우스 올리면 1.2배 확대) */
        .logo-link {
            display: inline-block;
        }
        .header-logo { 
            width: 140px; 
            height: auto; 
            transition: transform 0.3s ease; /* 부드러운 확대 효과 */
        }
        .header-logo:hover { 
            transform: scale(1.2);          /* 1.2배 확대 */
        }

        /* 아래쪽 영역: 내비게이션 메뉴 바 */
        .nav-bar { 
            display: flex; 
            gap: 15px; 
            flex-wrap: wrap;                /* 화면이 아주 좁을 경우 메뉴가 다음 줄로 자연스럽게 떨어지도록 함 */
            justify-content: center;
            padding: 0 10px;
        }
        .nav-bar a {
            text-decoration: none; 
            color: #268bd2; 
            font-weight: bold; 
            font-size: 15px;
            padding: 8px 16px; 
            background-color: #ffffff; 
            border: 1px solid #268bd2;
            border-radius: 5px; 
            transition: all 0.3s ease;
        }
        .nav-bar a:hover { 
            background-color: #268bd2; 
            color: #ffffff; 
        }

        /* ========================================== */
        /* 3. 모바일 반응형 디자인 (화면이 좁아질 때)   */
        /* ========================================== */
        @media screen and (max-width: 768px) {
            .header-section {
                padding: 15px 0;
                gap: 10px;
            }
            
            .header-logo {
                width: 110px;                 /* 스마트폰 화면에서는 로고를 살짝 더 아담하게 조절 */
            }

            .nav-bar a {
                font-size: 14px;
                padding: 6px 12px;            /* 모바일에서 버튼 크기를 손가락으로 누르기 좋게 최적화 */
            }
        }
    </style>
</head>
<body>

    <!-- 상단 두 줄 헤더 구역 -->
    <header class="header-section">
        <!-- 첫 번째 줄 (위쪽): 로고 (클릭 시 홈 이동, 호버 시 1.2배 확대) -->
        <a href="index.html" class="logo-link">
            <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="header-logo">
        </a>

        <!-- 두 번째 줄 (아래쪽): 내비게이션 메뉴 바 -->
        <nav class="nav-bar">
            <!-- 현재 머물고 있는 페이지에는 파란색 배경 스타일을 넣어주세요! -->
            <a href="about.html">책방 소개</a>
            <a href="books.html">도서 목록</a>
            <a href="contact.html" style="background-color: #268bd2; color: #ffffff;">오시는 길</a>
        </nav>
    </header>

    <!-- 오시는 길 본문 구역 -->
    <main class="contact-container">
        <h3>오시는 길 & 찾아오시는 방법</h3>

        <!-- 책방 상세 주소 및 운영 정보 안내 박스 -->
        <div class="info-box">
            <p><strong>📍 주소:</strong> 대한민국 과학로 123, Netropy 빌딩 1층</p>
            <p><strong>⏰ 운영 시간:</strong> 화요일 ~ 일요일 (오전 10시 ~ 오후 8시 / 매주 월요일 휴무)</p>
            <p><strong>📞 문의 전화:</strong> 02-123-4567</p>
            <p><strong>🚇 대중교통:</strong> 과학역 3번 출구에서 도보 5분 거리</p>
        </div>

        <!-- 카카오 지도 길찾기 미리보기 이미지 -->
        <img src="images/map-preview.png" alt="Netropy Books 위치 지도" style="width: 100%; max-width: 500px; border-radius: 10px; margin-bottom: 20px;">

        <!-- 카카오 지도 길찾기 버튼 -->
        <div class="map-nav-container">
            <a href="https://kko.to/f-qqm1hM58" 
               target="_blank" 
               style="display: inline-block; padding: 12px 24px; background-color: #fee500; color: #3c1e1e; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.2s ease;">
               🚗 카카오 지도로 길 찾기
            </a>
        </div>
    </main>

    <!-- 하단 구역 -->
    <footer class="footer-section">
        <p>&copy; 2026 Netropy Books. All rights reserved.</p>
    </footer>

</body>
</html>
