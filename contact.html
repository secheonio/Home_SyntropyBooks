<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>오시는 길 | Netropy Books</title>
    <style>
        /* ========================================== */
        /* 1. 전체 페이지 기본 스타일 설정               */
        /* ========================================== */
        body {
            background-color: #fdf6e3; /* 따뜻한 책방 분위기의 아이보리 배경 */
            display: flex;          /* 가로 배치를 위한 핵심 */
            justify-content: space-between; /* 로고는 왼쪽 끝, 메뉴는 오른쪽 끝으로 */
            align-items: center;    /* 세로 기준 가운데 정렬 */
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            color: #333333;
        }

        /* 로고 크기 조정 */
        .header-logo {
            width: 120px; /* 로고를 적당한 크기로 줄임 */
            height: auto;
        }

        /* ========================================== */
        /* 2. 상단 헤더 및 내비게이션 메뉴 바 스타일       */
        /* ========================================== */
        .header-section {
            background-color: #eee8d5;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #586e75;
        }

        .header-section h2 {
            margin: 0 0 15px 0;
            color: #586e75;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .nav-bar a {
            text-decoration: none;
            color: #268bd2;
            font-weight: bold;
            font-size: 15px;
            padding: 6px 14px;
            background-color: #ffffff;
            border: 1px solid #268bd2;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .nav-bar a:hover {
            background-color: #268bd2;
            color: #ffffff;
        }

        /* ========================================== */
        /* 3. 오시는 길 본문 구역 스타일 (✨ 핵심 콘텐츠) */
        /* ========================================== */
        .contact-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 40px;
            background-color: #ffffff; /* 하얀색 종이 박스 느낌 */
            border: 1px solid #e1dcd0;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center; /* 안쪽 내용을 보기 좋게 중앙 정렬 */
        }

        .contact-container h3 {
            color: #b58900;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 책방 주소 및 안내 텍스트 스타일 */
        .info-box {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 30px;
            text-align: left; /* 주소는 읽기 편하게 왼쪽 정렬 */
            background-color: #fdf6e3;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #268bd2;
        }

        /* ========================================== */
        /* 4. 구글 지도 반응형 감싸개 박스 (✨ 중요!)     */
        /* ========================================== */
        .map-wrapper {
            width: 100%;
            height: 400px; /* 지도의 높이 설정 */
            border-radius: 8px;
            overflow: hidden; /* 모서리가 둥글 때 밖으로 튀어나오는 지도 자르기 */
            border: 1px solid #ddd;
        }

        /* 구글 지도 iframe 태그 자체를 박스 크기에 꽉 차게 조절 */
        .map-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0; /* 기본 테두리 제거 */
        }

        /* ========================================== */
        /* 5. 하단(Footer) 영역 스타일                 */
        /* ========================================== */
        .footer-section {
            background-color: #073642;
            color: #93a1a1;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: 60px;
        }

        /* ========================================== */
        /* 6. 모바일 반응형 디자인 (화면이 좁아질 때)   */
        /* ========================================== */
        @media screen and (max-width: 768px) {
            .contact-container {
                margin: 20px 15px;
                padding: 20px;
            }
            .map-wrapper {
                height: 300px; /* 스마트폰 화면에서는 지도를 살짝 낮게 조절 */
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 구역: 메뉴 바 포함 -->
    <!-- 상단 헤더 구역 -->
    <header class="header-section">
        <!-- 로고 영역: 왼쪽 끝으로 배치 -->
        <a href="index.html" class="logo-link">
            <img src="images/NB_logo_Black.png" alt="Netropy Books 로고" class="header-logo">
        </a>

        <!-- 내비게이션 메뉴 영역 -->
        <nav class="nav-bar">
            <!-- 홈 버튼은 삭제하고, 필요한 메뉴만 배치 -->
            <a href="about.html">책방 소개</a>
            <a href="books.html">도서 목록</a>
            <a href="contact.html">오시는 길</a>
        </nav>
    </header>

    <!-- 오시는 길 본문 구역 -->
    <main class="contact-container">
        <h3>오시는 길 & 찾아오시는 방법</h3>

        <!-- 책방 상세 주소 및 운영 정보 안내 박스 -->
        <div class="info-box">
            <p><strong>📍 주소:</strong> 대한민국 과학로 123, Netropy 빌딩 1층</p>
            <p><strong>⏰ 운영 시간:</strong> 화요일 ~ 일요일 (오전 10시 ~ 오후 8시 / 매주 월요일 휴무)</p>
            <p><strong>📞 문의 전화:</strong> 02-123-4567</p>
            <p><strong>🚇 대중교통:</strong> 과학역 3번 출구에서 도보 5분 거리</p>
        </div>

        <!-- 카카오 지도 길찾기 버튼 시작 -->
        <img src="images/map-preview.png" alt="Netropy Books 위치 지도" style="width: 100%; max-width: 500px; border-radius: 10px;">

        <div class="map-nav-container" style="text-align: center; margin: 20px 0;">
            <a href="https://kko.to/f-qqm1hM58" 
            target="_blank" 
            style="display: inline-block; padding: 12px 24px; background-color: #fee500; color: #3c1e1e; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            🚗 카카오 지도로 길 찾기
            </a>
        </div>
        <!-- 카카오 지도 길찾기 버튼 끝 -->
    </main>

    <!-- 하단 구역 -->
    <footer class="footer-section">
        <p>&copy; 2026 Netropy Books. All rights reserved.</p>
    </footer>

</body>
</html>
