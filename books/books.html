<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 비율 자동 조절 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 목록 | Syntropy Books</title>

    <!-- 공통 CSS 연결 (헤더 스타일이 이 안에 모두 들어있습니다) -->
    <link rel="stylesheet" href="../css/common.css">
    <!-- 도서 목록 전용 스타일시트 연결 -->
    <link rel="stylesheet" href="../css/books.css">
</head>
<body>
    <!-- 통일된 헤더 구조 -->
    <header class="header-section">
        <!-- 1. 좌측 로고 영역 -->
        <div class="header-left">
            <a href="../index.html">
                <img src="../images/SB_logo_White.png" alt="Syntropy Books 로고" class="header-logo">
            </a>
        </div>
        
        <!-- 2. 우측 분할 영역 (타이틀 + 메뉴) -->
        <div class="header-right">
            <!-- 상단: 메인 텍스트 -->
            <div class="header-top-row">
                <div class="main-header-text">Syntropy Books</div>
            </div>

            <!-- 하단: 개념 소개 + 메뉴 -->
            <div class="header-bottom-row">   
                <!-- [왼쪽 칸] 남은 공간을 모두 차지하는 소개 문구 -->             
                <div class="header-intro-text">
                    <span>Syntropy : 무질서 속에서 새로운 질서와 생명력을 만들어내는 힘</span>
                </div>
                
                <!-- [오른쪽 칸] 버튼 크기만큼만 공간을 차지하는 메뉴 -->
                <div class="header-nav-wrap">
                    <nav class="nav-bar">
                        <!-- 페이지별로 active 클래스 위치만 변경 -->
                        <a href="../about/about.html">책방 소개</a>
                        <a href="books.html" class="active">도서 목록</a>
                        <a href="../contact/contact.html">오시는 길</a>
                    </nav>
                </div>
            </div>          
        </div>
    </header>

    <!-- 도서 목록 반응형 그리드 본문 -->
    <main class="book-container">
        <!-- 추후 이곳에 도서 카드(book-card) 요소들을 추가해 나갑니다 -->
        <p>등록된 도서를 준비 중입니다.</p>
    </main>

    <!-- 공통 푸터 -->
    <footer class="footer-section">
        <p>&copy; 2026 Netropy Books. All rights reserved.</p>
    </footer>

</body>
</html>
