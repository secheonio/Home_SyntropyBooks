<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 안내 | Syntropy Books</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/books.css">
</head>
<body>
    <header class="header-section">
        <div class="header-inner">
            <div class="header-left"><a href="../index.html"><img src="../images/SB_logo_White.png" alt="Syntropy Books 로고" class="header-logo"></a></div>
            <div class="header-right">
                <div class="header-top-row"><div class="main-header-text">Syntropy Books</div></div>
                <div class="header-bottom-row">
                    <div class="header-nav-wrap"><nav class="nav-bar"><a href="../about/about.html">책방 소개</a><a href="books.html" class="active">도서 관리</a><a href="../contact/contact.html">오시는 길</a></nav></div>
                </div>
            </div>
        </div>
    </header>
    <main class="book-detail-page">
        <nav class="book-detail-back-links" aria-label="도서 페이지 이동">
            <a class="book-detail-back" href="books.html">도서목록으로 돌아가기</a>
            <a class="book-detail-back" href="books-new.html">신간 도서 코너로 돌아가기</a>
        </nav>
        <section class="book-detail-card" aria-live="polite">
            <img class="book-detail-cover" id="book-detail-cover" alt="도서 표지">
            <div class="book-detail-content">
                <p class="subtitle" id="book-detail-category"></p>
                <h1 id="book-detail-title">도서를 찾을 수 없습니다.</h1>
                <p class="book-detail-author" id="book-detail-author"></p>
                <p class="book-detail-meta" id="book-detail-translator"></p>
                <p class="book-detail-meta" id="book-detail-publisher"></p>
                <p class="book-detail-meta" id="book-detail-price"></p>
                <p class="book-detail-meta" id="book-detail-stock"></p>
                <p class="book-detail-meta" id="book-detail-registered"></p>
                <p class="book-detail-meta" id="book-detail-new-until"></p>
                <h2>책 소개</h2>
                <p id="book-detail-description"></p>
                <blockquote id="book-detail-preview"></blockquote>
            </div>
        </section>
    </main>
    <footer class="footer-section"><p>&copy; 2026 Syntropy Books. All rights reserved.</p></footer>
    <script src="../js/catalog-data.js"></script>
    <script src="../js/book-detail.js"></script>
    <script src="../js/admin-login.js"></script>
</body>
</html>
